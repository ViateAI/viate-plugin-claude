# npm trusted publisher for this file only:
# organization ViateAI, repository viate-plugin-claude,
# workflow filename npm-publish.yml, environment left empty.
# Allow npm publish. A new configuration expires unless this workflow
# publishes successfully within 2 days.
# Release events created by GITHUB_TOKEN do not start this workflow.
# CI dispatches it, and workflow_dispatch can publish an existing tag.
name: Publish @viateai/plugin-claude

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        default: v1.0.0
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check OIDC exchange
        run: |
          node --input-type=module <<'EOF'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          url.searchParams.append("audience", "npm:registry.npmjs.org")
          const id = await fetch(url, {
            headers: {
              Accept: "application/json",
              Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
            },
          })
          const idJson = await id.json()
          if (!id.ok || !idJson.value) {
            console.log(`github-oidc ${id.status}`)
            process.exit(1)
          }
          const exchange = await fetch("https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@viateai%2fplugin-claude", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${idJson.value}`,
              "Content-Type": "application/json",
            },
          })
          const text = await exchange.text()
          console.log(exchange.ok ? `exchange ${exchange.status}` : `exchange ${exchange.status} ${text.slice(0, 400)}`)
          EOF
      - run: npm publish --access public
